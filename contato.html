<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Meu Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="#">Sobre</a>
            <a href="contato.html" class="ativo">Contato</a>
        </nav>
    </header>

    <main class="conteúdo">
        <div class="cartao-perfil">
            <h1>Entre em Contato</h1>
            <p>Preencha os campos abaixo para me enviar uma mensagem.</p>
            
            <form action="#" method="POST">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Como posso ajudar?" required></textarea>
                
                <button type="submit">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 - Criado por mim</p>
    </footer>

</body>
</html>
