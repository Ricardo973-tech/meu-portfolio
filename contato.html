<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Ricardo Rivella da Costa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menu de Navegação - Deve ser idêntico em todas as páginas -->
    <nav class="menu-principal">
        <ul>
            <li><a href="index.html">Sobre mim</a></li>
            <li><a href="formacao.html">Formação</a></li>
            <li><a href="portfolio.html">portfolio</a></li>
            <li><a href="contato.html" class="active">Contato</a></li>
        </ul>
    </nav>

    <main class="container">
        <section id="secao-contato">
            <h1>Entre em Contato</h1>
            <p>Preencha o formulário abaixo para falar comigo.</p>

            <!-- Formulário de Contato -->
            <form id="meuFormulario">
                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@dominio.com">
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Como posso ajudar?"></textarea>
                </div>

                <button type="submit" id="btnEnviar">Enviar Mensagem</button>
            </form>

            <!-- Local onde aparecerá a confirmação de sucesso/erro -->
            <div id="statusMensagem"></div>
        </section>
    </main>

    <!-- JavaScript Obrigatório para Validação e Interação -->
    <script>
        // Seleção dos elementos do DOM
        const formulario = document.getElementById('meuFormulario');
        const statusMsg = document.getElementById('statusMensagem');

        // Evento de submissão do formulário
        formulario.addEventListener('submit', function(event) {
            // Evita que a página recarregue ao clicar em enviar
            event.preventDefault();

            // Captura dos valores dos campos
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const mensagem = document.getElementById('mensagem').value.trim();

            // Lógica de Validação
            if (nome === "" || email === "" || mensagem === "") {
                alert("Por favor, preencha todos os campos obrigatórios.");
                statusMsg.innerHTML = "<p style='color: red;'>Erro: Preencha todos os campos!</p>";
                return;
            }

            // Validação simples de formato de e-mail usando RegEx
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("Por favor, insira um e-mail válido.");
                return;
            }

            // Simulação de Envio com Sucesso
            // 1. Limpa os campos do formulário
            formulario.reset();

            // 2. Exibe mensagem visual de confirmação
            alert("Mensagem enviada com sucesso!");
            statusMsg.innerHTML = "<p style='color: green; font-weight: bold;'>Obrigado! Sua mensagem foi enviada.</p>";
            
            // 3. Exemplo de manipulação visual: esconde o botão após envio
            document.getElementById('btnEnviar').style.display = 'none';
        });
    </script>

</body>
</html>
