<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Ricardo</title>
    <!-- ATENÇÃO: Verifique se o nome do arquivo CSS no GitHub é estilo.css ou style.css -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <nav class="menu">
            <a href="index.html">Sobre mim</a>
            <a href="formacao.html">Formação</a>
            <a href="portfolio.html">Portfólio</a>
            <a href="contato.html" class="active">Contato</a>
        </nav>
    </header>

    <main class="conteudo">
        <div class="cartao-perfil">
            <h1>Entre em Contato</h1>
            <p>Envie uma mensagem e retornarei o mais breve possível.</p>

            <!-- Formulário com os requisitos do trabalho -->
            <form id="formContato">
                <input type="text" id="nome" placeholder="Seu Nome Completo" required>
                <input type="email" id="email" placeholder="Seu E-mail (ex@dominio.com)" required>
                <textarea id="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
                <button type="submit" id="btnEnviar">Enviar Mensagem</button>
            </form>

            <div id="statusMensagem" style="margin-top: 15px; font-weight: bold;"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 - Desenvolvido por Ricardo</p>
    </footer>

    <script>
        const formulario = document.getElementById('formContato');
        const statusMsg = document.getElementById('statusMensagem');

        formulario.addEventListener('submit', function(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const mensagem = document.getElementById('mensagem').value.trim();

            // Validação simples exigida
            if (nome === "" || email === "" || mensagem === "") {
                alert("Ops! Parece que faltou alguma informação no formulário.");
                return;
            }

            // Validação de formato de e-mail
            if (!email.includes('@') || !email.includes('.')) {
                alert("O formato do e-mail não parece correto. Pode revisar?");
                return;
            }

            // Simulação de envio (Requisito 5)
            alert("Olá! Recebi seu contato e responderei em breve.");
            
            // Limpa os campos após o envio
            formulario.reset();
            
            // Mensagem visual de sucesso
            statusMsg.innerHTML = "Tudo certo! Logo entrarei em contato.";
            statusMsg.style.color = "green";
        });
    </script>
</body>
</html>
